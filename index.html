<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

  <title>Frontend Mentor | Tip calculator app</title>
</head>
<link rel="stylesheet" href="style.css" type="text/css">

<body>
  <h2 class="title">S P L I T T E R</h2>

  <div class="container">
    <div class="left">
      <label>Bill</label>
      <input type="number" id="bill" placeholder="0.00" />

      <label>Select Tip %</label>
      <div class="tips">
        <button onclick="setTip(5)">5%</button>
        <button onclick="setTip(10)">10%</button>
        <button onclick="setTip(15)">15%</button>
        <button onclick="setTip(25)">25%</button>
        <button onclick="setTip(50)">50%</button>
        <input type="number" id="customTip" placeholder="Custom" />
      </div>

      <label>Number of People</label>
      <input type="number" id="people" placeholder="1" />
    </div>

    <div class="right">
      <div class="result">
        <p>Tip Amount <span>/ person</span></p>
        <h1 id="tipAmount">$0.00</h1>
      </div>

      <div class="result">
        <p>Total <span>/ person</span></p>
        <h1 id="total">$0.00</h1>
      </div>

      <button class="reset" onclick="reset()">RESET</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
